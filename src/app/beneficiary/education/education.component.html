<body class="p-4">
    <div class="grid grid-rows-11 gap-4 max-w-md mx-auto">
        <div class="row-span-1">
            <p class="text-xl font-bold">Education Information</p>
            <p>Enter beneficiary resident details below</p>
        </div>
        <div class="row-span-1">
            <form class="max-w-sm">
                <select id="funding_options" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of options; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Other Certifications">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Name of Primary school attended">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full rounded-none  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Location of Primary school attended">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Name of Secondary school attended">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Location of Secondary school attended">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Name of Tertiary institution attended">
        </div>
        <div class="row-span-1">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Location of Tertiary institution attended">
        </div>
        <div class="row-span-1">
            <div class="flex items-center">
                <input  checked id="currently_in_school" type="checkbox" [name]="checked" [(ngModel)]="checked" class="w-4 h-4 text-green-600 bg-gray-100 border-gray-300 rounded focus:ring-green-500 dark:focus:ring-green-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" (ngModelChange)="toggleChecked($event)">
                <label for="currently_in_school" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">I am currently in school</label>
            </div>
        </div>
        <div class="row-span-1" *ngIf="showOthers === true">
            <input type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Enter your current Level">
        </div>
        <div class="row-span-1" *ngIf="showOthers === true">
            <form class="max-w-sm">
                <select id="funding_options" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of fundingOptions; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <!-- <div class="row-span-1 bg-gray-200 p-4">Placeholder Row</div> -->
        <div class="row-span-1 flex ml-[-15px]">
            <div class="w-3/4 p-4">
                <button (click)="submit()"  type="submit" [disabled]="null"
                [ngStyle]="{ 'background-color': null ? '#B8B7C8' : '#109856' }"
                class="w-[305px] h-12 px-4 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-500 focus:outline-none focus:bg-green-600">
                Proceed
            </button>
            </div>
            <div class="w-1/4 p-4">
                <button  type="submit" [disabled]="!null" 
                [ngStyle]="{ 'background-color': !null ? '#B8B7C8' : '#109856' }"
                class="w-full ml-[-30px] h-12 px-4 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-500 focus:outline-none focus:bg-green-600">
                Skip
            </button>
            </div>
        </div>
    </div>
</body>
