<body class="p-4">
    <div *ngIf="showWelcomeMsg === true" class="fixed top-0 left-0 w-full bg-gray-200 text-black p-4">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Welcome back!</strong> &nbsp;&nbsp;
            <span class="block sm:inline">Let's continue from where we stopped!...</span>
            <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
              <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
            </span>
          </div>
    </div>
    <div class="grid grid-rows-11 gap-4 max-w-md mx-auto">
        <div class="row-span-1">
            <p class="text-xl font-bold">Other Health Information</p>
            <!-- <p>Enter beneficiary resident details below</p> -->
        </div>
        <div class="row-span-1">
            <form class="max-w-sm" [formGroup]="healthForm">
                <select id="funding_options" formControlName="healthCondition" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of options; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1">
            <form class="max-w-sm" [formGroup]="healthForm">
                <select formControlName="healthQuestion" id="funding_options" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of ailments; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1" *ngIf="showSpecifyAiment === true">
          <form [formGroup]="healthForm">
            <input formControlName="specifyAilment" type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Please specify ailment">
          </form>
        </div>
        <div class="row-span-1">
            <form class="max-w-sm" [formGroup]="healthForm">
                <select formControlName="HMOQuestion" id="funding_options" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of hmo; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1" *ngIf="showSpecifyHMO === true">
         <form [formGroup]="healthForm">
            <input formControlName="specifyHMO" type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="If you have, please specify which HMO?">
         </form>
        </div>
        <div class="row-span-1">
            <form class="max-w-sm" [formGroup]="healthForm">
                <select formControlName="receivingTreatmentQuestion" id="funding_options" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of optionz; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1">
           <form [formGroup]="healthForm">
            <input formControlName="publicHospitalQuestion" type="text" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Which state public hospital are you enrolled in, if any?">
           </form>
        </div>
       
        <div class="row-span-1 w-full mt-2">
            <button (click)="routeToNext()" id="btn" type="submit" [disabled]="disableBtn" [ngStyle]="{ 'background-color': disableBtn ? '#B8B7C8' : '#109856' }"
                class="h-12 w-[400px] px-4 py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:bg-blue-600">
                Proceed
            </button>
        </div>
    </div>
</body>
