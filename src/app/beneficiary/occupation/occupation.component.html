<body class=" p-4">
    <div *ngIf="showWelcomeMsg === true" class="fixed top-0 left-0 w-full bg-gray-200 text-black p-4">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Welcome back!</strong> &nbsp;&nbsp;
            <span class="block sm:inline">Let's continue from where we stopped!...</span>
            <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
                <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20">
                    <title>Close</title>
                    <path
                        d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z" />
                </svg>
            </span>
        </div>
    </div>
    <div class="grid grid-rows-11 gap-4 max-w-md mx-auto">
        <div class="row-span-1">
            <p class="text-xl font-bold">Occupation</p>
            <!-- <p>Almost there enter your next of kin information.</p> -->
        </div>

        <div class="row-span-1">
            <form class="max-w-sm" [formGroup]="occupationForm">
                <select formControlName="occupation" id="funding_options"
                    class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                    <option *ngFor="let option of options; let id=index">
                        <span>{{ option }}</span>
                    </option>
                </select>
            </form>
        </div>
        <div class="row-span-1" *ngIf="showStudentsInfo === true">
            <form class="max-w-sm" [formGroup]="occupationForm">
                <input type="text" id="text-input" aria-describedby="helper-text-explanation"
                    class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    placeholder="Name of institution*">
            </form>
        </div>

        <br>
        <div class="row-span-1"  *ngIf="showCivilServerntsInfo === true">
              <div>
                <small class="text-xs mb-4">What are your professional qualifications?*</small>
                <div class="input-container">
                 
                  <div class="relative">
                    <div class="words-container">
                        <div *ngFor="let word of words" class="bg-gray-200 rounded-lg p-2 mr-2 mb-2">
                          {{ word }}
                          <button (click)="removeWord(word)" class="ml-2 text-gray-600">&times;</button>
                        </div>
                      </div>
                    <input type="text" [(ngModel)]="currentWord" (keydown.enter)="addWord()" class="rounded border border-gray-300 px-2 py-1 pl-10 mt-2">

                        <mat-icon id="mat-icon" (click)="addWord()">add</mat-icon>
                    </button>
                  </div>
                </div>
                <div class="flex items-center mt-2">
                    <input id="default-checkbox" type="checkbox"
                        class="w-4 h-4 cursor-pointer text-green-600 bg-gray-100 border-gray-300 rounded focus:ring-green-500 dark:focus:ring-green-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">

                        </div>
              </div>
        </div>
<br>

<br>

        <div class="row-span-1 w-full mt-2">
