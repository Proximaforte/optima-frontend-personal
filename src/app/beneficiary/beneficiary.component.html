<div class="grid grid-cols-5 gap-4">
    <div class="col-span-1 bg-gray-50 h-full">
        <div class="mt-4 ml-4">
            <span class="text-gray-400 font-medium">Registration Progress</span>
            <br><br>
            <div class="cursor-pointer">
                <ol class="relative text-gray-500 border-l-4 border-dotted border-gray-200 dark:border-gray-700 dark:text-gray-400">
                    <li class="mb-10 ms-6" *ngFor="let item of beneficiaryItems; let i = index" (click)="itemClicked(i)">
                        <span class="absolute flex items-center justify-center w-7 h-7 rounded-full -start-4  ring-2" [ngClass]="{'ring-slate-400': !isSelectedIndex(i), ' ring-lemonish': isSelectedIndex(i)}">
                      <a [ngClass]="{'lemonish-text': selectedItemIndex === i}" *ngIf="i+1 !== 10"> 0{{i + 1}}</a>
                      <a [ngClass]="{'lemonish-text': selectedItemIndex === i}" *ngIf="i+1 === 10"> {{i + 1}}</a>
                  </span>
                        <p class="text-sm " [ngClass]="{'lemonish-text': selectedItemIndex === i }">{{item | uppercase}}</p>
                    </li>
                </ol>


            </div>
        </div>
    </div>
    <div class="col-span-4  h-full">
        <div id="second-column-items">
            ssdsdsd
        </div>
    </div>
</div>
