<body>
    <div class="grid grid-cols-5 gap-4">
        <div class="hidden sm:block">
            <app-sidebar-helper></app-sidebar-helper>
        </div>


        <div class="grid grid-rows-11 gap-8 max-w-md max-h-screen mx-auto overflow-hidden col-span-4 ">
            <div style="display: flex; align-items: center; margin-top: 2px;">
                <img (click)="routeToPrevious()" [src]="routeBack" alt="routeBack" height="25" width="25"
                    style="margin-right: 10px; cursor: pointer;">
                <p class="text-xl font-bold" style="margin: 0;">Face Capturing</p>
            </div>

            <div class="flex items-start">
                <img [src]="bullet" alt="routeBack" class="h-5 w-5 mr-2 mt-1">
                <p class="inline text-gray-500">
                    Click the button to begin capturing, Skip capturing for beneficiaries that can not get their
                    fingerprints captured and provide evidence on next step
                </p>
            </div>

            <br><br>
            <div class="text-gray-500 font-bold mt-4 ml-12">  Sample</div>
            <div class="flex items-start">
              
                <div class="flex flex-col justify-center items-center h-40 w-40 bg-gray-200 rounded-xl relative">
                    <img [src]="fingerprint" alt="Fingerprint" class="h-24 w-24 object-cover" />
                    <div class="absolute bottom-[-7px]">
                        <img [src]="marked" alt="checked" class="h-4 w-4" style="background-color: #109856; border-radius: 12px;">
                    </div>
                </div>
            </div>

          <div id="position-item">
            <div class="flex items-start relative w-full min-w-[200px] h-10">
                <div class="absolute cursor-pointer grid w-5 h-5 place-items-center text-blue-gray-500 top-2/4 right-3 -translate-y-2/4"
                  >
                    <img [src]="skip" alt="" (click)="skipCapturing()">
                </div>
                <input value="Skip fingerprint Capturing" readonly class="peer w-full h-full bg-transparent text-blue-gray-700  font-sans font-bold outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 border focus:border-2 border-t-transparent focus:border-t-transparent text-sm px-3 py-2.5 rounded-[7px] !pr-9 border-blue-gray-200 focus:border-gray-900"
                    />        
            </div>
            <br>

        <div class="flex items-start">
            <button (click)="routeToNext()" type="submit"  class="w-full border-white text-white rounded-md py-2 hover:bg-blue-600 w-full mt-4" id="btn" >
                Begin Capturing
            </button>
        </div>
          </div>
        </div>
    </div>
</body>
