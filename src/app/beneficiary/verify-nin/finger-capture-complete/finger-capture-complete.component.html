<body>
    <div class="min-h-screen flex justify-center items-center" >
        <div class="grid grid-rows-3 grid-cols-1 gap-4">
            <div id="first-row-content" class="row-span-1 flex justify-center items-center">
                <!-- Capture Complete -->
            </div>
            <div class="row-span-1 flex justify-center items-center">
                <!-- Second Row Content -->

                <div class="relative w-48 h-48 rounded-full overflow-visible border-4 border-green-100"
                    id="dashed-circle">
                    <img [src]="passport" alt="Person" class="w-full h-full object-cover rounded-full" />
                    <div class="absolute inset-0 flex justify-center items-center">
                        <div class="w-32 h-32 bg-opacity-75 rounded-lg flex justify-center items-center">
                            <img [src]="capture" alt="Person" class="w-full h-full object-cover" />
                        </div>
                    </div>
                    <!-- Adjusted position for mark-icon -->
                    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 -mb-6">
                        <div class="w-12 h-12 bg-green-500 rounded-full flex justify-center items-center border-2 border-white"
                            style="background-color: #34AA44;" id="mark-icon">
                            <!-- Mark icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

            

            </div>
            <div class="row-span-1 flex justify-center items-center">
                <div class="flex flex-col items-center w-full ">
                    <div  (click)="proceed()" class="flex items-center cursor-pointer" id="retake-caption" mat-dialog-close>
                        <!-- <mat-icon class="text-gray-500" id="retake-caption">autorenew</mat-icon> -->
                        <span class="text-xs font-medium">Complete</span>
                    </div>
                    <button (click)="proceed()" type="submit"  class="w-full border-white text-white rounded-md py-2 hover:bg-blue-600 w-full mt-4" id="btn"  mat-dialog-close>
                        Continue
                    </button>
                </div>
                
                <div>
    
                </div>
            </div>

        </div>
      
    </div>

</body>
