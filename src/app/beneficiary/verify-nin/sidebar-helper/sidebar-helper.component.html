<div class="col-span-1 h-full hidden sm:block w-[300px]">
    <mat-stepper orientation="vertical" [linear]="isLinear" #stepper >
      <mat-step *ngFor="let item of beneficiaryItems; let i = index">
          <ng-template matStepperIcon="edit">
              <mat-icon>done</mat-icon>
          </ng-template>
          <ng-template matStepLabel>
              <span id="step-label" class="text-xs text-black" [ngClass]="{'lemonish-text': selectedItemIndex === i, 'step-label': selectedItemIndex !== i}">{{item | uppercase }}</span>
          </ng-template>
      </mat-step>
    </mat-stepper>
    <!-- <button >hjhjh</button> -->
</div>
