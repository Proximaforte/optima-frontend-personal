<body>
    <div *ngIf="showWelcomeMsg === true" class="fixed top-0 left-0 w-full bg-gray-200 text-black p-4">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Welcome back!</strong> &nbsp;&nbsp;
            <span class="block sm:inline">Let's continue from where we stopped!...</span>
            <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
              <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
            </span>
          </div>
    </div>
   
    <div class="grid grid-rows-3 gap-4 justify-items-start">
        <div class="row-span-1">
            <p class="text-lg font-semibold">
                Verify Beneficiary NIN
            </p>
        </div>
        
        <div class="relative w-96 h-11">
          <form [formGroup]="ninForm" (keyup.enter)="submit()">
            <input formControlName="nin" [placeholder]="ninPlaceHolder" (blur)="onInputBlur()" (click)="detectClicked()" [readOnly]="ninForm.get('nin')?.value?.length === 11 ? true : false"
            class="w-full h-full px-3 py-3 font-sans text-sm font-normal transition-all bg-transparent border rounded-md peer text-blue-gray-700 outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 focus:border-2 border-t-transparent focus:border-t-transparent border-blue-gray-200 focus:border-gray-900" />
        <label
            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[4.1] text-gray-500 peer-focus:text-gray-900 before:border-blue-gray-200 peer-focus:before:!border-gray-900 after:border-blue-gray-200 peer-focus:after:!border-gray-900">
            NIN
        </label>
        <small class="text-red-500 font-bold">
            <span class="float-left"
                *ngIf="ninForm.get('nin')?.['invalid'] && (ninForm.get('nin')?.['touched'] || ninForm.get('nin')?.['dirty'])">
                <small class="text-danger" *ngIf="ninForm.get('nin')?.errors?.['required']">
                    *NIN is a required field
                </small>
                <small class="text-danger" *ngIf="ninForm.get('nin')?.errors?.['pattern']">
                    *NIN cannot contain alphabets or symbols
                </small>
                <small class="text-danger" *ngIf="ninForm.get('nin')?.errors?.['minLength']">
                    *NIN cannot be more than 11 digits
                </small>
                <small class="text-danger" *ngIf="ninForm.get('nin')?.errors?.['maxLength']">
                    *NIN cannot be less than 11 digits
                </small>
            </span>
        </small>

          </form>
        </div>
        
        <div class="row-span-1 w-96 mt-2" *ngIf="showBtn === true">
            <button (click)="submit()" type="submit" [disabled]="!ninForm.valid" [ngStyle]="{ 'background-color': !ninForm.valid ? '#B8B7C8' : '#109856' }" class="w-full px-4 py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:bg-blue-600">
                Submit</button>
        </div>
    </div>
    
</body>
