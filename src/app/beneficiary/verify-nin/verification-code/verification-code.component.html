<body>
    <div *ngIf="showWelcomeMsg === true" class="fixed top-0 left-0 w-full bg-gray-200 text-black p-4">
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Welcome back!</strong> &nbsp;&nbsp;
            <span class="block sm:inline">Let's continue from where we stopped!...</span>
            <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
              <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
            </span>
          </div>
    </div>
    <div class="grid grid-cols-5 gap-4">
        <div class="hidden sm:block">
            <app-sidebar-helper></app-sidebar-helper>
           </div>
    
    
        <div class="col-span-4 h-full" id="first-column-items">
                <div class="grid grid-rows-3 gap-4 justify-items-start">
        <div class="row-span-1">
            <p class="text-lg font-semibold" id="align-header">
                Enter Verification Code
            </p>
            <p class="text-xs text-gray-700" id="second-text"> we just sent a one-time secure code to {{maskedPhoneNumber}}</p>
        </div>
        
        <div class="relative w-96 h-11">
            <form>
                <div class="mb-4 flex">
                    <app-verify-bvn-otp (otpChange)="handleOtpChange($event)"></app-verify-bvn-otp>
                </div>
                
                
                <div class="mb-4">
                    <span class="text-xs" id="third-text">Didn't recieve a code? <b>Resend OTP</b> in <b>{{ countdown }}s</b></span>
                </div>
                <br>

                <button type="submit" [disabled]="disabledBtn" (click)="submit()"
                    [ngStyle]="{ 'background-color': disabledBtn ? '#B8B7C8' : '#109856' }"
                    class="bg-blue-500 text-white rounded-md py-2 hover:bg-blue-600" id="btn-width">
                    Proceed
                </button>
            </form>
        </div>
        
        <!-- <div class="row-span-1 w-96 mt-2">
            <button (click)="submit()" type="submit" [disabled]="disabledBtn" [ngStyle]="{ 'background-color': disabledBtn ? '#B8B7C8' : '#109856' }" class="w-full px-4 py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:bg-blue-600">
                Submit</button>
        </div>  -->
    </div>
        </div>
    </div>
</body>
