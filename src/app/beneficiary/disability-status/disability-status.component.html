<body>
    <div class="grid grid-cols-5 gap-4">
        


        <div class="grid grid-rows-11 max-w-md max-h-screen mx-auto overflow-hidden col-span-4 " id="parent">
            <div class="row-span-1">
                <p class="text-xl font-bold">Is the beneficiary disabled?</p>
                <p class="text-sm">Select disability status</p>
            </div>

            <div id="parent-div">
                <div class="row-span-1">
                    <div class="flex items-center justify-center cursor-pointer ml-[-40px]">
                        <img [src]="disabled" class="mr-4" width="175" (click)="showNull()">
                        <img [src]="showActive === true ? hovered : yes" width="175" (click)="showYes()">
                        <!-- hovered -->
                    </div>  
                </div>
<br>
                <div  class="row-span-1" *ngIf="showActive === true">
                    <form class="max-w-sm" [formGroup]="disabilityForm">
                        <select id="funding_options" formControlName="disabilityType" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer">
                            <option *ngFor="let option of options; let id=index">
                                <span>{{ option }}</span>
                            </option>
                        </select>
                    </form>
                </div>
<br>
                <div class="row-span-1" *ngIf="showInputBox === true">
                  <form [formGroup]="disabilityForm">
                    <input type="text" formControlName="disability" id="text-input" aria-describedby="helper-text-explanation" class="w-full  rounded-none bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Describe disability*">
                  </form>
                </div>
<br>
<div class="row-span-1 w-full mt-2">
    <button (click)="submit()" id="btn" type="submit" [disabled]="disableBtn === true" [ngStyle]="{ 'background-color': disableBtn === true ? '#B8B7C8' : '#109856' }"
        class="h-12 w-[365px] px-4 py-2 bg-blue-500 text-white font-semibold rounded-md hover:bg-blue-600 focus:outline-none focus:bg-blue-600">
        <div class="flex items-center justify-center"> 
            <span class="mr-2">Proceed</span> 
            <div role="status" class="ml-2" *ngIf="showSpinner === true">
                <svg aria-hidden="true"
                    class="inline w-4 h-4 text-gray-200 animate-spin dark:text-gray-600 fill-green-500"
                    viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                        fill="currentColor" />
                    <path
                        d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                        fill="currentFill" />
                </svg>
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </button>
</div>

            </div>

        </div>
    </div>
</body>
