<body class="p-4">
  <div
    *ngIf="showWelcomeMsg === true"
    class="fixed top-0 left-0 w-full bg-gray-200 text-black p-4"
  >
    <div
      class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative"
      role="alert"
    >
      <strong class="font-bold">Welcome back!</strong> &nbsp;&nbsp;
      <span class="block sm:inline"
        >Let's continue from where we stopped!...</span
      >
      <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
        <svg
          class="fill-current h-6 w-6 text-green-500"
          role="button"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
        >
          <title>Close</title>
          <path
            d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"
          />
        </svg>
      </span>
    </div>
  </div>
  <div class="grid grid-rows-11 gap-2 mx-auto">
    <div class="row-span-1">
      <p class="text-xl font-bold">Personal Data</p>
      <!-- <p>Enter beneficiary resident details below</p> -->
    </div>
    <div class="row-span-1">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <label class="block text-xs font-light text-gray-700 mt-[-10px]">
            First Name - {{beneficiaryData?.firstName}}
          </label>
          <input
            formControlName="firstName"
            id="readonly-input"
            type="text"
            class="focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
            placeholder="Placeholder"
            readonly
          />
        </form>
      </div>
    </div>

    <div
      class="row-span-1 grid grid-cols-2 mt-[-10px]"
      style="margin-left: -18px"
    >
      <div class="p-4">
        <div class="relative">
          <form [formGroup]="personalDetailsForm">
            <label class="block text-xs font-light text-gray-700 mt-[-10px]">
              Last Name
            </label>
            <input
              formControlName="lastName"
              id="lastName-gender"
              type="text"
              class="focus:ring-indigo-500 focus:border-indigo-500 block w-[221px] shadow-sm sm:text-sm border-gray-300 rounded-md"
              placeholder="Placeholder"
              readonly
            />
          </form>
        </div>
      </div>
      <div class="p-4" id="child-input">
        <div class="relative">
          <form [formGroup]="personalDetailsForm">
            <label class="block text-sm font-light text-gray-700 mt-[-15px]">
              Middle Name
            </label>
            <input
              formControlName="middleName"
              id="readonly-input"
              type="text"
              class="focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:w-[222px] shadow-sm sm:text-sm border-gray-300 rounded-md"
              placeholder="Placeholder"
              readonly
            />
            <!--md:w-[180px]  lg:w-[222px] xl:w-[222px] -->
          </form>
        </div>
      </div>
    </div>

    <div class="row-span-1">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <label class="block text-xs font-light text-gray-700 mt-[-10px]">
            Phone Number
          </label>
          <input
            formControlName="phoneNumber"
            id="readonly-input"
            type="text"
            class="focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"
            placeholder="Input Phone number"
          />
        </form>
      </div>
    </div>
    <div class="row-span-1">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <label class="block text-xs font-light text-gray-700 mt-[-10px]">
            BVN (Optional)
          </label>
          <input
            formControlName="bvn"
            type="text"
            aria-describedby="helper-text-explanation"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="Enter BVN"
          />
        </form>
      </div>
    </div>
    <div class="row-span-1">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <label class="block text-xs font-light text-gray-700 mt-[-10px]">
            Email Address (Optional)
          </label>
          <input
            formControlName="email"
            type="text"
            aria-describedby="helper-text-explanation"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="Email Address*"
          />
        </form>
      </div>
    </div>
    <div
      class="row-span-1 grid grid-cols-2 mt-[-20px]"
      style="margin-left: -18px"
    >
      <div class="p-4">
        <div class="relative">
          <form [formGroup]="personalDetailsForm">
            <label class="block text-xs font-light text-gray-700 mt-[-10px]">
              Gender
            </label>
            <input
              formControlName="gender"
              id="lastName-gender"
              type="text"
              class="focus:ring-indigo-500 focus:border-indigo-500 block w-[221px] shadow-sm sm:text-sm border-gray-300 rounded-md"
              placeholder="Input your Gender"
              readonly
            />
          </form>
        </div>
      </div>
      <div class="p-4" id="child-input">
        <div class="relative">
          <form [formGroup]="personalDetailsForm">
            <label class="block text-xs font-light text-gray-700 mt-[-10px]">
              Date of Birth
            </label>
            <input
              [value]="ninDetails.birthDate"
              readonly
              formControlName="dateOfBirth"
              id="readonly-input"
              type="text"
              class="focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:w-[222px] shadow-sm sm:text-sm border-gray-300 rounded-md"
              placeholder="Date of Birth"
            />

            <!-- <mat-form-field id="date-picker">
                        <mat-label> 
                            Date of Birth*
                        </mat-label>
                        <input matInput [matDatepicker]="picker" [(ngModel)]="dateOfBirth" [name]="dateOfBirth" [value]="ninDetails.birthDate">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                      </mat-form-field>  -->
          </form>
        </div>
      </div>
    </div>
    <div class="row-span-1">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <label class="block text-xs font-light text-gray-700 mt-[-10px]">
            Place of Birth
          </label>
          <input
            formControlName="placeOfBirth"
            type="text"
            aria-describedby="helper-text-explanation"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="Place of Birth**"
          />
        </form>
      </div>
    </div>
    <div class="row-span-1">
      <form class="max-w-sm" [formGroup]="personalDetailsForm">
        <label class="block text-xs font-light text-gray-700 mt-[-10px]">
          Religion
        </label>
        <select
          formControlName="religion"
          id="religion-input"
          class="bg-gray-5 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 cursor-pointer"
        >
          <option *ngFor="let item of options; let id = index">
            {{ item }}
          </option>
        </select>
      </form>
    </div>
    <div class="row-span-1" *ngIf="showOthers === true">
      <div class="relative">
        <form [formGroup]="personalDetailsForm">
          <input
            type="text"
            aria-describedby="helper-text-explanation"
            formControlName="others"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="If others, kindly input religion*"
          />
        </form>
      </div>
    </div>
    <div class="row-span-1 w-full mt-2">
      <button
        (click)="submitForm()"
        type="submit"
        [disabled]="disableBtn"
        [ngStyle]="{ 'background-color': disableBtn ? '#B8B7C8' : '#109856' }"
        class="w-full h-12 px-4 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-500 focus:outline-none focus:bg-green-600"
      >
        <div class="flex items-center justify-center">
          <span class="mr-2">Proceed</span>
          <div role="status" class="ml-2" *ngIf="showSpinner === true">
            <svg
              aria-hidden="true"
              class="inline w-4 h-4 text-gray-200 animate-spin dark:text-gray-600 fill-green-500"
              viewBox="0 0 100 101"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                fill="currentColor"
              />
              <path
                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                fill="currentFill"
              />
            </svg>
            <span class="sr-only">Loading...</span>
          </div>
        </div>
      </button>
    </div>
  </div>
</body>
