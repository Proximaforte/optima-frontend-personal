<section class="bg-optimaBlue w-16 ml-3 self-center rounded-full h-full mt-3 flex flex-col items-center overflow-hidden">
    <div class="mt-3">
        <img [src]="bankLogo" height="42" width="42" alt="Logo" />
    </div>

    <div class="flex-grow" id="move-items">
        <mat-nav-list>
            <!-- [routerLink]="['/' + item.route]" -->
            <mat-list-item *ngFor="let item of menuItems"  routerLinkActive="list-item-active" [routerLinkActiveOptions]="{ exact: false }" class="mb-6">
                <button mat-button (click)="onLogout(item)" [matTooltip]="item?.name === 'profile' ? 'select beneficiary to view profile' : item?.name">
                    <mat-icon
                    class="custom-icon"  mat-list-icon [svgIcon]="item.name" [ngClass]="{ 'stroke-green-500': isActive(item.route) }">
                   </mat-icon>
                </button>
            </mat-list-item>
        </mat-nav-list>
    </div>
</section>
