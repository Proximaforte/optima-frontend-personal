<header
  class="flex items-center justify-between ml-6 mr-10 mt-8 mb-8 text-white font-sora"
>
  <div class="flex items-center text-lg">
    <!-- <h1 class="text-optimaBlack font-bold">{{title}}</h1>
    <p class="px-2 text-optimaGray">{{ name }}</p> -->
    <div class="grid grid-cols-1 grid-rows-2 gap-0">
      <div>
        <span class="text-optimaGray">Dashboard / </span>
        <span class="text-optimaBlack font-bold">{{ subPath }}</span>
      </div>
      <div>
        <span class="text-optimaBlack text-2xl font-bold">{{ title }}</span>
        <span class="text-optimaGray"> {{ userName }}</span>
        <!-- <span class="text-optimaGray"> {{ name }}</span> -->
      </div>
    </div>
  </div>
  <div [routerLink]="['./profile']" class="cursor-pointer">
    <img
      src="assets/images/avatar.png"
      alt="Your Image"
      class="h-12 w-12 rounded-full"
    />
  </div>
</header>
