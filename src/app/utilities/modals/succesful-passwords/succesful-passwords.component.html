<body class="bg-gray-100">
    <div class="p-4">
        <div class="text-center">
            <img [src]="successMark" alt="success-mark" class="mx-auto mb-4" />
            <h2 class="text-xl font-bold mb-2">Password Created successfully</h2>
        </div>
        <div class="text-center mb-4">
            <div class="mb-2">You have successfully created a new password</div>
            <div>kindly proceed to login.</div>
        </div>
        <br>
        <div class="text-center">
            <button (click)="submit()" mat-dialog-close class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                Login
            </button>
        </div>
    </div>
</body>
