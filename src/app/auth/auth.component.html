<body class="flex items-center justify-center h-full bg-gray-100">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-0 h-full w-full">
        <!-- Left Column -->
        <div class="hidden lg:flex h-full bg-cover bg-center relative"
            style="background-image: url('/assets/images/bg-image.svg');">
            <!-- Far Left Icon -->
            <div class="absolute top-2 left-1 w-full p-4">
                <img [src]="optima" alt="Optima" width="120" height="200" />
            </div>

            <!-- Larger Icon in the center -->
            <img [src]="kwaraStateLogo" alt="kwara-state-logo" width="200" height="250" id="kwara-state-logo" />
            <div class="absolute bottom-0 left-0 p-4">
                <img [src]="poweredByOptima" alt="powered-by-optima" width="150" height="240" class="ml-3">
            </div>
        </div>
        <!-- Right Column -->
        <div class="h-full bg-white flex items-center justify-center">
            <!-- Login Form font-euclid-->

            <form class="w-80" [formGroup]=loginForm>
                <div>
                    <span class="text-xl font-bold text-gray-800">Agent Login</span> <br>
                    <span class="text-gray-500">Check your mail for default login details</span>
                </div>
                <br>
                <div class="mb-4">

                    <div class="relative w-full min-w-[200px] h-11">
                        <input formControlName="email" [placeholder]="emailPlaceHolder" (blur)="onInputBlur()"
                            (click)="detectClicked()"
                            class="w-full h-full px-3 py-3 font-sans text-sm font-normal transition-all bg-transparent border rounded-md peer text-blue-gray-700 outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 focus:border-2 border-t-transparent focus:border-t-transparent border-blue-gray-200 focus:border-gray-900" /><label
                            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[4.1] text-gray-500 peer-focus:text-gray-900 before:border-blue-gray-200 peer-focus:before:!border-gray-900 after:border-blue-gray-200 peer-focus:after:!border-gray-900">
                            Email
                        </label>

                        <small class="text-red-500 font-bold">
                            <span class="float-left"
                                *ngIf="loginForm.get('email')?.['invalid'] && (loginForm.get('email')?.['touched'] || loginForm.get('email')?.['dirty'])">
                                <small class="text-danger" *ngIf="loginForm.get('email')?.errors?.['required']">
                                    *email is a required field
                                </small>
                                <small class="text-danger" *ngIf="loginForm.get('email')?.errors?.['email']">
                                    *Please enter a valid email address
                                </small>
                            </span>
                        </small>

                    </div>

                </div>
                <br>
                <div class="mb-6">

                    <div class="relative w-full min-w-[200px] h-10">
                        <div class="absolute cursor-pointer grid w-5 h-5 place-items-center text-blue-gray-500 top-2/4 right-3 -translate-y-2/4"
                            (click)="togglePasswordVisibility()">
                            <mat-icon>{{ showEye ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </div>
                        <input #passwordInput formControlName="password" [placeholder]="passwordPlaceHolder"
                            (blur)="onInputBlur_()" (click)="detectClicked_()" [type]=" showEye ? 'password' : 'text'"
                            class="peer w-full h-full  bg-transparent text-blue-gray-700 font-sans font-normal outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 border focus:border-2 border-t-transparent focus:border-t-transparent text-sm px-3 py-2.5 rounded-[7px] !pr-9 focus:border-gray-900" />
                        <label
                            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[3.75] text-gray-500 peer-focus:text-gray-900 peer-focus:before:!border-gray-900  peer-focus:after:!border-gray-900">
                            Password
                        </label>
                        <small class="text-red-500 font-bold">
                            <span class="float-left"
                                *ngIf="loginForm.get('password')?.['invalid'] && (loginForm.get('password')?.['touched'] || loginForm.get('password')?.['dirty'])">
                                <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['required']">
                                    *password is a required field
                                </small>
                                <!-- <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['pattern']">
                                    *At least 1 lowercase, 1 uppercase, 1 symbol, and 1 digit is required...
                                </small>
                                <small class="text-danger" *ngIf="loginForm.get('password')?.errors?.['minlength']">
                                    *At least 8 digits are required
                                </small> -->
                            </span>
                        </small>
                        <mat-hint class="float-right font-medium mt-2 cursor-pointer hover:underline"
                            [routerLink]="'/auth/forgot-passwords'">Forgot Password?</mat-hint>
                    </div>


                </div>
                <br><br>
                <div class="flex items-center justify-between">

                        <div role="status">
                            <svg aria-hidden="true" class="inline w-4 h-4 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>

                            <span class="sr-only">Loading...</span>
                        </div>
                        Login
                    </button> -->
                    <button (click)="signIn()" type="submit" [disabled]="!loginForm.valid"
                        [ngStyle]="{ 'background-color': !loginForm.valid ? '#B8B7C8' : '#109856' }"
                        class="text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                        <div class="flex items-center justify-center"> 
                            <span class="mr-2">Login</span> 
                            <div role="status" class="ml-2" *ngIf="showSpinner === true">
                                <svg aria-hidden="true"
                                    class="inline w-4 h-4 text-gray-200 animate-spin dark:text-gray-600 fill-green-500"
                                    viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"

                                        d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"

                                </svg>
                                <span class="sr-only">Loading...</span>
                            </div>
                        </div>
                    </button>


                </div>
            </form>
        </div>
    </div>
</body>
