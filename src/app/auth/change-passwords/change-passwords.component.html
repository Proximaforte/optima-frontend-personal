<body class="flex items-center justify-center h-full bg-gray-100">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-0 h-full w-full">
        <!-- Left Column -->
        <div class="hidden lg:flex h-full bg-cover bg-center relative" style="background-image: url('/assets/images/bg-image.svg');">
            <!-- Far Left Icon -->
            <div class="absolute top-2 left-1 w-full p-4">
                <img [src]="optima" alt="Optima" width="120" height="200" />
            </div>

            <!-- Larger Icon in the center -->
            <img [src]="kwaraStateLogo" alt="kwara-state-logo" width="200" height="250" id="kwara-state-logo" />
            <div class="absolute bottom-0 left-0 p-4">
                <img [src]="poweredByOptima" alt="powered-by-optima" width="150" height="240" class="ml-3">
            </div>
        </div>
        <!-- Right Column -->
        <div class="h-full bg-white flex items-center justify-center">
            <!-- Login Form font-euclid-->

            <form class="w-80" [formGroup]="passwordForm">
                <div>
                    <span class="text-xl font-bold text-gray-800">Change password</span> <br>
                    <span class="text-gray-500">Check your mail for default login details</span>
                </div>
                <br>
                <div class="mb-6">
                    <div class="relative w-full min-w-[200px] h-10">
                        <div class="absolute cursor-pointer grid w-5 h-5 place-items-center text-blue-gray-500 top-2/4 right-3 -translate-y-2/4"
                            (click)="togglePasswordVisibility()">
                            <mat-icon>{{ showEye ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </div>
                        <input #passwordInput  formControlName="password" [placeholder]="passwordPlaceHolder" (blur)="onInputBlur_()" (click)="detectClicked_()" [type]=" showEye ? 'password' : 'text'"
                            class="peer w-full h-full bg-transparent text-blue-gray-700 font-sans font-normal outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 border focus:border-2 border-t-transparent focus:border-t-transparent text-sm px-3 py-2.5 rounded-[7px] !pr-9 border-blue-gray-200 focus:border-gray-900"
                            />
                        <label
                            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[3.75] text-gray-500 peer-focus:text-gray-900 before:border-blue-gray-200 peer-focus:before:!border-gray-900 after:border-blue-gray-200 peer-focus:after:!border-gray-900">
                            Password
                        </label>
                        <small class="text-red-500 font-bold">
                            <span class="float-left"
                                *ngIf="passwordForm.get('password')?.['invalid'] && (passwordForm.get('password')?.['touched'] || passwordForm.get('password')?.['dirty'])">
                                <small class="text-danger" *ngIf="passwordForm.get('password')?.errors?.['required']">
                                    *password is a required field
                                </small>
                            </span>
                        </small>
                    </div>
                </div>
                <br>
                <div class="mb-6">
                    <div class="relative w-full min-w-[200px] h-10">
                        <div class="absolute cursor-pointer grid w-5 h-5 place-items-center text-blue-gray-500 top-2/4 right-3 -translate-y-2/4"
                            (click)="toggleConfirmPasswordVisibility()">
                            <mat-icon>{{ showEye_ ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </div>
                        <input #confirmPasswordInput  formControlName="conFirmPassword" [placeholder]="confirmPasswordPlaceHolder" (blur)="onInputBlur()" (click)="detectClicked()" [type]=" showEye ? 'password' : 'text'"
                            class="peer w-full h-full bg-transparent text-blue-gray-700 font-sans font-normal outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 border focus:border-2 border-t-transparent focus:border-t-transparent text-sm px-3 py-2.5 rounded-[7px] !pr-9 border-blue-gray-200 focus:border-gray-900"
                            />
                        <label
                            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[3.75] text-gray-500 peer-focus:text-gray-900 before:border-blue-gray-200 peer-focus:before:!border-gray-900 after:border-blue-gray-200 peer-focus:after:!border-gray-900">
                          Confirm Password
                        </label>
                        <small class="text-red-500 font-bold">
                            <small>{{errorMsg}}</small>
                        </small>
                    </div>


                </div>
                <br><br>
                <div class="flex items-center justify-between">
                    <button [disabled]="disabledBtn" (click)="submitCorrectData()" type="submit"  [ngStyle]="{ 'background-color': disabledBtn ? '#B8B7C8' : '#109856' }" class="bg-green-600 hover:bg-green-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
