<body>

    <div class="ml-4">
        <div class="h-12 w-56 mb-6 px-4">

            <mat-form-field>
                <mat-label>
                    <mat-icon>calendar_today</mat-icon>
                    <span> {{ options[2] }}</span>
                </mat-label>
                <mat-select disableRipple>
                    <mat-option value="" *ngFor="let option of options" class="bg-white">
                        {{ option }}
                    </mat-option>

                </mat-select>
            </mat-form-field>

        </div>

    </div>

    <div class="flex flex-row px-6">
        <div class="py-5 min-h-full">
            <div class="flex flex-row mb-12 items-center justify-center">
                <img src="assets/images/check.svg" alt="" height="24" width="24" />
                <small class="text-xl font-euclid font-normal ml-2 text-optimaGray">Successfully Onboarded</small
          >
        </div>
        <p class="text-[104px] text-[#344054]">{{ total }}</p>
      </div>
      <div class="border-r h-28 mt-6 mx-12"></div>
      <div class="py-5 min-h-full">
        <div class="flex flex-row mb-12 items-center justify-center">
          <img src="assets/images/Pause.svg" alt="" height="24" width="24" />
          <small class="text-xl font-euclid font-normal ml-2 text-optimaGray"
            >Incomplete Onboarding</small
          >
        </div>
        <p class="text-[104px] text-[#344054]">{{ total }}</p>
      </div>
    </div>

  <div class="w-[80%] mt-12 border rounded-xl px-6 py-4">
    <p class="mb-4 text-optimaGray text-lg font-medium">Center Information</p>

    <div class="flex justify-between">
      <div class="flex flex-col justify-between" *ngFor="let agent of agents">
        <div class="border-none">
          <div class="flex flex-row">
            <div>
              <img [src]="agent.icon" alt="image" class="w-10 h-10" />
            </div>
            <div class="flex flex-col ml-4 -mt-1">
              <span class="text-[10px] text-optimaGray m-0">{{
                agent.text
              }}</span>
              <span class="text-lg -mt-1">{{ agent.data }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="empty-data" class="container mx-auto">
    <app-beneficiary-table></app-beneficiary-table>
  </div>


</body>
