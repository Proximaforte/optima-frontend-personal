<div *ngIf="agents?.length > 0" class="rounded-xl border border-tableGray mt-10 py-4">
  <div class="flex justify-between items-center px-4">
    <mat-card class="text-sm relative rounded-xl px-6 py-3 shadow-lg text-gray-700 font-bold text-3xl">
      Recent Onboarding
    </mat-card>

    <button
      class="flex bg-optimaGreen hover:bg-optimaGreen text-white font-bold py-2 px-4 rounded-md w-max-content"
      routerLink="../beneficiary"
    >
      <img
        src="assets/images/add.svg"
        height="20"
        width="20"
        alt=""
        class="mr-2"
      />
      Add New Beneficiary
    </button>
  </div>
  <br>
  <div>
    <table class="w-full">
      <thead class="bg-grey">
        <tr>
          <th
            scope="col"
            class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6"
          >
            Name
          </th>
          <th
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
          >
            Date of Birth
          </th>
          <th
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
          >
            Email
          </th>
          <th
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
          >
            NIN
          </th>
          <th
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
          >
            Phone Number
          </th>
          <th
            scope="col"
            class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
          >
            Gender
          </th>
          <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
            <span class="sr-only">Edit</span>
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
        <tr class="text-left">
          <td
            class="py-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6 flex items-center"
          >
            Olukoya Damilare
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
            Oct 23, 2009
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
            <!-- TODO: Remember to track the quantity sold and represent it here as order remaining/qty -->
           Olukoyadamilare@gmail.com
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
            222266535
          </td>
          <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
          09067989484
          </td>
          <td
            class="relative flex justify-between whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6 overflow-visible"
          >
           Female
          </td>
        </tr>
      
      </tbody>
    </table>
  </div>
</div>

        <!-- Empty Data onboarded -->

        <div *ngIf="agents?.length === 0" class="flex flex-col items-center mt-24">
          <div><img [src]="noData" alt="" /></div>
          <div class="flex flex-col items-center mt-8">
            <p class="text-xl font-bold">Oops, No Beneficiary Yet</p>
            <small class="text-optimaGray text-sm">
              Your onboarded Beneficiaries would
            </small>
            <small class="text-optimaGray text-sm">appear here once done</small>
          </div>
          <div class="flex items-center h-20">
            <button (click)="addBeneficiary()"
              type="submit"
              class="text-white bg-optimaGreen font-bold py-2 px-4 h-10 rounded-md focus:outline-none focus:shadow-outline w-full  w-max-content"
            >
              Onboard New Beneficiary
            </button>
          </div>
        </div>

</body>
