<div class="rounded-xl border border-tableGray ml-4 py-4">
  <div class="flex justify-between items-center mb-4 px-4">
    <div class="relative w-4/12">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3">
        <svg
          class="h-5 w-5 text-gray-400"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M9 2a7 7 0 015.602 11.274l5.256 5.255-1.414 1.414-5.255-5.256A7 7 0 119 2zm0 2a5 5 0 100 10A5 5 0 009 4z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
      <input
        class="pl-10 pr-4 py-2 w-full bg-white  h-10 placeholder-zestPlaceholder outline-hidden rounded border-[1px] border-solid border-tableGray p-4 focus:border-tableGray focus:ring-tableGray"
        type="text"
        placeholder="Search..."
      />
    </div>

    <div class="flex justify-between w-3/12">
      <button
        class="flex bg-optimaGreen hover:bg-optimaGreen text-white font-bold py-2 px-4 rounded-md w-[200px]"
        routerLink="../beneficiary"
      >
        <img
          src="assets/images/add.svg"
          height="20"
          width="20"
          alt=""
          class="mr-2"
        />
        Add New Beneficiary
      </button>
      <button
        (click)="openModal()"
        class="flex text-black border border-tableGray font-bold py-2 px-4 rounded-md w-24"
      >
        <img
          src="assets/images/Filter.svg"
          height="20"
          width="20"
          alt=""
          class="mr-2"
        />
        Filter
      </button>
    </div>
  </div>

   <div>
      <table class="w-full">
        <thead class="bg-grey">
          <tr>
            <th
              scope="col"
              class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6"
            >
              Name
            </th>
            <th
              scope="col"
              class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
            >
              Date of Birth
            </th>
            <th
              scope="col"
              class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
            >
              Email
            </th>
            <th
              scope="col"
              class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
            >
              NIN
            </th>
            <th
              scope="col"
              class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
            >
              Phone Number
            </th>
            <th
              scope="col"
              class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
            >
              Gender
            </th>
            <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
              <span class="sr-only">Edit</span>
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white" role="button" [routerLink]="['../beneficiary-details']">
          <tr class="text-left">
            <td
              class="py-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6 flex items-center"
            >
              Olukoya Damilare
            </td>
            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
              Oct 23, 2009
            </td>
            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
              <!-- TODO: Remember to track the quantity sold and represent it here as order remaining/qty -->
             Olukoyadamilare@gmail.com
            </td>
            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
              222266535
            </td>
            <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
            09067989484
            </td>
            <td
              class="relative flex justify-between whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6 overflow-visible"
            >
             Female
            </td>
          </tr>
         
          <!-- More people... -->
        </tbody>
      </table>
    </div>
   <div class="flex justify-center">
                
                <pagination-controls
                  class="custom-pagination items-center mt-2"
                  previousLabel="Prev"
                  (pageChange)="currentPage = $event"
                ></pagination-controls>
              </div>

    <native-pagination
      [start]="start"
      [end]="end"
      [element]="element"
      [total]="total"
      (changePage)="pageChanged($event)"
    ></native-pagination>
  </div> -->
</div>
