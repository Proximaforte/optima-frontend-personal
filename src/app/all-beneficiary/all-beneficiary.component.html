<div class="rounded-xl border border-tableGray ml-4 py-4">
  <div class="flex justify-between items-center mb-4 px-4">
    <div class="relative w-4/12">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3">
        <svg
          class="h-5 w-5 text-gray-400"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M9 2a7 7 0 015.602 11.274l5.256 5.255-1.414 1.414-5.255-5.256A7 7 0 119 2zm0 2a5 5 0 100 10A5 5 0 009 4z"
            clip-rule="evenodd"
          />
        </svg>
      </span>
      <input
        class="pl-10 pr-4 py-2 w-full bg-white  h-10 placeholder-zestPlaceholder outline-hidden rounded border-[1px] border-solid border-tableGray p-4 focus:border-tableGray focus:ring-tableGray"
        type="text"
        placeholder="Search..."
      />
    </div>

    <div class="flex justify-between w-3/12">
      <button
        class="flex bg-optimaGreen hover:bg-optimaGreen text-white font-bold py-2 px-4 rounded-md w-[200px]"
        routerLink="../beneficiary"
      >
        <img
          src="assets/images/add.svg"
          height="20"
          width="20"
          alt=""
          class="mr-2"
        />
        Add New Beneficiary
      </button>
      <button
        (click)="openModal()"
        class="flex text-black border border-tableGray font-bold py-2 px-4 rounded-md w-24"
      >
        <img
          src="assets/images/Filter.svg"
          height="20"
          width="20"
          alt=""
          class="mr-2"
        />
        Filter
      </button>
    </div>
  </div>
  <table class="w-full">
    <thead class="bg-grey">
      <tr>
        <th class="flex items-center">
          <mat-checkbox class="rounded p-0 ps-2"></mat-checkbox>
          <span class="d-inline-block p-0 ps-3">Name ID</span>
        </th>
        <th>Date of Birth</th>
        <th>Email</th>
        <th>NIN</th>
        <th>Phone Number</th>
        <th>Gender</th>
      </tr>
    </thead>
    <tbody class="pl-5">
      <tr role="button" [routerLink]="['../beneficiary-details']">
        <td class="flex items-center">
          <mat-checkbox class="rounded p-0 ps-2"></mat-checkbox>
          <span class="d-inline-block p-0 ps-3">Name ID</span>
        </td>
        <td>1990-01-01</td>
        <td>john.doe@example.com</td>
        <td>222289098543</td>
        <td>123456789</td>
        <td>Male</td>
      </tr>
      <!-- Add more rows as needed -->
    </tbody>
  </table>
  <div>
    <native-pagination
      [start]="start"
      [end]="end"
      [element]="element"
      [total]="total"
      (changePage)="pageChanged($event)"
    ></native-pagination>
  </div>
</div>
