name: Optima Agent Frontend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y openvpn nodejs npm traceroute

      - name: Set up PEM file
        run: |
          echo "${{ secrets.SECRET_PEM }}" > vpn.pem
          sudo chmod 600 vpn.pem

      - name: Set up VPN credentials 
        run: |
          echo "${{ secrets.VPN_USERNAME }}" > vpn-credentials.txt
          echo "" >> vpn-credentials.txt
          sudo chmod 600 vpn-credentials.txt
          cat vpn-credentials.txt  # Debugging step to verify content   
          
      - name: Use SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          sudo chmod 600 private_key

      - name: Verify SSH Connection
        run: ssh -i private_key -o StrictHostKeyChecking=no ubuntu@192.168.10.15 "echo 'SSH Connection Established'"
        
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # Use the correct version of Node.js here

      - name: Install dependencies
        run: npm install

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Build the Angular app
        run: ng build --configuration=production

      - name: Deploy to server
        run: |
          rsync -e "ssh -i private_key -o StrictHostKeyChecking=no" -rltgoDzvO --delete dist/ ubuntu@192.168.10.15:/var/www/optima-agent-frontend
